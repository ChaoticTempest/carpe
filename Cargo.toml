[package]
name = "carpe"
version = "0.1.0"
edition = "2021"
description = "Multiplex cargo target dirs across git worktrees"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/entropy/carpe"
keywords = ["cargo", "git", "worktree", "target-dir", "build"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[[bin]]
name = "carpe"
path = "src/main.rs"

# Locking is managed via fd-lock for cross-platform advisory file locks (flock/LockFileEx).

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
dialoguer = "0.12.0"
dirs = "6.0.0"
fd-lock = "4.0.4"
shell-words = "1.1.0"
